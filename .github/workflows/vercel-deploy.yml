name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: spicy-fairytales/package-lock.json

      - name: Install dependencies
        run: |
          cd spicy-fairytales
          PUPPETEER_SKIP_DOWNLOAD=true npm ci

      - name: Build for Vercel
        run: |
          cd spicy-fairytales
          npm run build:vercel

      - name: Deploy to Vercel
        # Only deploy if Vercel secrets are configured
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@888da851026e0573da056b061931bcb765a915c4 # v41.1.4
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-args: ${{ github.event_name == 'push' && '--prod' || '' }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
          working-directory: spicy-fairytales